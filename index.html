<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101724"><title>СВАРОГ — честный ремонт</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><button class="home" id="backBtn" aria-label="Главный экран">СВАРОГ</button><nav aria-label="Направления"><button data-category="plumbing">Сантехника</button><button data-category="finishing">Отделка</button><button data-category="electric">Электрика</button><button data-category="turnkey">Под ключ</button></nav></header>
<main><section class="portal" id="portal"><canvas id="waterCanvas" aria-hidden="true"></canvas><div class="portal__top"><img src="assets/logo.png" class="portal__logo" alt="Сварог — честный ремонт"><p>Выберите направление</p></div>  <div class="portal__grid">
    <button class="portal-card" data-category="plumbing"><img src="assets/icon-plumbing.png" alt=""><span>01</span><strong>Сантехника</strong></button>

    <button class="portal-card" data-category="electric"><img src="assets/icon-electric.png" alt=""><span>03</span><strong>Электрика</strong></button>
    <button class="portal-card" data-category="turnkey"><img src="assets/icon-turnkey.png" alt=""><span>04</span><strong>Ремонт под ключ</strong></button>
  </div>
</section>
<section id="category" hidden><div id="splitRuler"></div><section class="price-section" id="priceSection"><div class="price-intro"><small id="priceKicker"></small><h2>Услуги и цены</h2><p>Ориентировочная стоимость работ. Точная смета фиксируется после осмотра объекта.</p></div><div class="service-stack" id="serviceStack"></div></section>
<section class="hero-fixed" id="heroFixed" aria-label="Экран направления"><div class="split-overlay" id="splitOverlay"></div></section></section></main><script src="app.js"></script><script src="water.js"></script></body></html>
